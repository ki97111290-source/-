<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fdfae7;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-definition"
        class="scene"
        data-composition-id="02-definition"
        data-composition-src="compositions/frames/02-definition.html"
        data-start="4"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-learn"
        class="scene"
        data-composition-id="03-learn"
        data-composition-src="compositions/frames/03-learn.html"
        data-start="9"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-example"
        class="scene"
        data-composition-id="04-example"
        data-composition-src="compositions/frames/04-example.html"
        data-start="14"
        data-duration="6.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-takeaway"
        class="scene"
        data-composition-id="05-takeaway"
        data-composition-src="compositions/frames/05-takeaway.html"
        data-start="20"
        data-duration="5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-definition", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.addLabel("hf:transition:01-hook:02-definition:crossfade", 4);
        tl.to("#el-02-definition", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-learn", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.addLabel("hf:transition:02-definition:03-learn:crossfade", 9);
        tl.to("#el-03-learn", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.fromTo("#el-04-example", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 14);
        tl.addLabel("hf:transition:03-learn:04-example:crossfade", 14);
        tl.to("#el-04-example", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.fromTo("#el-05-takeaway", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20);
        tl.addLabel("hf:transition:04-example:05-takeaway:crossfade", 20);
        tl.to({}, { duration: 25 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
